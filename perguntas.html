<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perguntas — 8 Níveis · Nutanix</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Montserrat', 'Helvetica Neue', -apple-system, sans-serif; background: #131313; color: #e9e9ee; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { background: rgba(255,255,255,0.03); border: 1px solid rgba(120,85,250,0.25); border-radius: 20px; padding: 36px 32px; max-width: 420px; width: 100%; }
        .logo { font-size: 2rem; font-weight: 800; text-align: center; letter-spacing: -1px; background: linear-gradient(135deg, #7855fa, #2cc4e0); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 4px; }
        .sub { text-align: center; color: #5f5f6a; font-size: 0.78rem; margin-bottom: 28px; letter-spacing: 1px; text-transform: uppercase; }
        label { font-size: 0.72rem; color: #9c9ca6; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; display: block; margin-bottom: 6px; }
        input, textarea { width: 100%; padding: 12px 14px; background: rgba(255,255,255,0.05); border: 1px solid rgba(120,85,250,0.18); border-radius: 10px; color: #e9e9ee; font-family: 'Montserrat', sans-serif; font-size: 0.95rem; outline: none; transition: border-color 0.2s; }
        input:focus, textarea:focus { border-color: rgba(120,85,250,0.6); }
        textarea { resize: vertical; min-height: 100px; }
        .field { margin-bottom: 18px; }
        button { width: 100%; padding: 14px; background: linear-gradient(135deg, #7855fa, #4b00aa); border: none; border-radius: 12px; color: white; font-family: 'Montserrat', sans-serif; font-size: 1rem; font-weight: 700; cursor: pointer; transition: opacity 0.2s, transform 0.1s; }
        button:hover { opacity: 0.9; } button:active { transform: scale(0.98); } button:disabled { opacity: 0.4; cursor: not-allowed; }
        .msg { text-align: center; margin-top: 16px; font-size: 0.85rem; min-height: 1.2em; }
        .msg.ok { color: #2cc4e0; } .msg.err { color: #ff7a5c; }
        .questions-section { margin-top: 28px; border-top: 1px solid rgba(120,85,250,0.18); padding-top: 20px; }
        .questions-title { font-size: 0.72rem; color: #9c9ca6; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 14px; }
        .q-list { display: flex; flex-direction: column; gap: 10px; }
        .q-card { padding: 12px 14px; background: rgba(120,85,250,0.07); border: 1px solid rgba(120,85,250,0.14); border-radius: 12px; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .q-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
        .q-nome { font-size: 0.7rem; font-weight: 700; color: #2cc4e0; }
        .q-time { font-size: 0.55rem; color: #555; }
        .q-texto { font-size: 0.82rem; color: #d0d0d8; line-height: 1.45; margin-bottom: 8px; }
        .q-footer { display: flex; align-items: center; }
        .q-vote-btn { background: rgba(120,85,250,0.12); border: 1px solid rgba(120,85,250,0.25); border-radius: 8px; padding: 4px 10px; color: #b3a1ff; font-family: 'Montserrat', sans-serif; font-size: 0.75rem; font-weight: 600; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 4px; width: auto; }
        .q-vote-btn:hover:not(.voted) { background: rgba(120,85,250,0.22); border-color: rgba(120,85,250,0.45); }
        .q-vote-btn.voted { background: rgba(120,85,250,0.3); border-color: rgba(120,85,250,0.6); color: #fff; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">8 Níveis</div>
        <div class="sub">Engenharia Agêntica · Nutanix · 2026</div>
        <form id="form">
            <div class="field"><label>Seu nome</label><input type="text" id="nome" placeholder="Como quer ser chamado?" maxlength="50"></div>
            <div class="field"><label>Sua pergunta</label><textarea id="pergunta" placeholder="O que você quer saber?" maxlength="500" required></textarea></div>
            <button type="submit" id="btn">Enviar pergunta</button>
        </form>
        <div class="msg" id="msg"></div>
        <div class="questions-section">
            <div class="questions-title">Perguntas da plateia</div>
            <div class="q-list" id="q-list">
                <div class="q-empty" id="q-empty" style="color:#555;font-size:0.8rem;text-align:center;margin-top:16px">Nenhuma pergunta ainda...</div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script>
        const SUPA_URL = 'https://ubjbawkcqsvumpcxkirb.supabase.co';
        const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InViamJhd2tjcXN2dW1wY3hraXJiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQwMDU0NDIsImV4cCI6MjA4OTU4MTQ0Mn0.JDvG7mPW7vqrAsXzcPhtFwDtO8mOvbUZliHrxXF5gPQ';
        const QA_SINCE = '2026-09-01T00:00:00Z';   // mesma constante do index.html
        const QA_CHANNEL = 'niveis-qa';

        const supa = supabase.createClient(SUPA_URL, SUPA_KEY);
        const channel = supa.channel(QA_CHANNEL);

        function getVotedIds() { try { return JSON.parse(localStorage.getItem('voted_perguntas_niveis') || '[]'); } catch { return []; } }
        function markVoted(id) { const ids = getVotedIds(); if (!ids.includes(id)) { ids.push(id); localStorage.setItem('voted_perguntas_niveis', JSON.stringify(ids)); } }
        function unmarkVoted(id) { localStorage.setItem('voted_perguntas_niveis', JSON.stringify(getVotedIds().filter(v => v !== id))); }
        function hasVoted(id) { return getVotedIds().includes(id); }
        function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

        const qList = document.getElementById('q-list');
        const qEmpty = document.getElementById('q-empty');

        function renderQuestion(p) {
            if (qEmpty) qEmpty.remove();
            if (document.getElementById('q-' + p.id)) return;
            const div = document.createElement('div'); div.className = 'q-card'; div.id = 'q-' + p.id; div.dataset.votos = p.votos || 0;
            const time = new Date(p.created_at).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
            const voted = hasVoted(p.id);
            div.innerHTML = `<div class="q-header"><span class="q-nome">${esc(p.nome) || 'Anônimo'}</span><span class="q-time">${time}</span></div>
                <div class="q-texto">${esc(p.pergunta)}</div>
                <div class="q-footer"><button class="q-vote-btn ${voted ? 'voted' : ''}" data-id="${p.id}">▲ <span class="q-vote-count">${p.votos || 0}</span></button></div>`;
            qList.appendChild(div);
        }
        function sortList() { const items = Array.from(qList.querySelectorAll('.q-card')); items.sort((a, b) => (parseInt(b.dataset.votos) || 0) - (parseInt(a.dataset.votos) || 0)); items.forEach(el => qList.appendChild(el)); }
        function updateVoteUI(id, newVotos) { const card = document.getElementById('q-' + id); if (!card) return; card.dataset.votos = newVotos; const c = card.querySelector('.q-vote-count'); if (c) c.textContent = newVotos; sortList(); }

        qList.addEventListener('click', async (e) => {
            const btn = e.target.closest('.q-vote-btn'); if (!btn || btn.dataset.loading) return;
            const id = parseInt(btn.dataset.id); const alreadyVoted = hasVoted(id); btn.dataset.loading = '1';
            const { data, error } = await supa.rpc(alreadyVoted ? 'desvotar_pergunta' : 'votar_pergunta', { p_id: id });
            delete btn.dataset.loading;
            if (error) { console.error('Erro ao votar:', error); return; }
            if (alreadyVoted) { unmarkVoted(id); btn.classList.remove('voted'); } else { markVoted(id); btn.classList.add('voted'); }
            updateVoteUI(id, data);
            channel.send({ type: 'broadcast', event: 'voto-pergunta', payload: { id, votos: data } });
        });

        (async () => {
            const { data } = await supa.from('perguntas').select('*').gte('created_at', QA_SINCE)
                .order('votos', { ascending: false }).order('created_at', { ascending: false });
            if (data && data.length) data.forEach(renderQuestion);
        })();

        channel
            .on('broadcast', { event: 'nova-pergunta' }, ({ payload }) => { if (payload) { renderQuestion(payload); sortList(); } })
            .on('broadcast', { event: 'voto-pergunta' }, ({ payload }) => { if (payload) updateVoteUI(payload.id, payload.votos); })
            .subscribe();

        const form = document.getElementById('form'); const btnSubmit = document.getElementById('btn'); const msg = document.getElementById('msg');
        form.addEventListener('submit', async e => {
            e.preventDefault();
            const nome = document.getElementById('nome').value.trim() || 'Anônimo';
            const pergunta = document.getElementById('pergunta').value.trim(); if (!pergunta) return;
            btnSubmit.disabled = true; btnSubmit.textContent = 'Enviando...'; msg.textContent = '';
            try {
                const res = await fetch(`${SUPA_URL}/rest/v1/perguntas`, {
                    method: 'POST',
                    headers: { 'apikey': SUPA_KEY, 'Authorization': `Bearer ${SUPA_KEY}`, 'Content-Type': 'application/json', 'Prefer': 'return=representation' },
                    body: JSON.stringify({ nome, pergunta })
                });
                if (!res.ok) throw new Error('Erro ao enviar');
                const rows = await res.json();
                channel.send({ type: 'broadcast', event: 'nova-pergunta', payload: rows[0] });
                renderQuestion(rows[0]); sortList();
                msg.className = 'msg ok'; msg.textContent = 'Pergunta enviada! Obrigado.';
                document.getElementById('pergunta').value = '';
            } catch (err) { msg.className = 'msg err'; msg.textContent = 'Erro ao enviar. Tente novamente.'; }
            btnSubmit.disabled = false; btnSubmit.textContent = 'Enviar pergunta';
        });
    </script>
</body>
</html>
